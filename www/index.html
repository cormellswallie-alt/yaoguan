<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2ECE1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor: https://localhost; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://qrng.anu.edu.au https://lfdr.de">
<title>爻观</title>
<link rel="stylesheet" href="css/app.css">
<style>
 /* 安全区：状态栏 / 手势条 */
 .view{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
 .tb{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
 .sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
</style>
</head>
<body>
<div id="app"></div>
<div id="splash">
  <div class="sp-ink"></div>
  <div class="sp-hx out"><div><i style="width:120px"></i></div><div><i style="width:120px"></i></div><div><i style="width:120px"></i></div><div><i style="width:52px"></i><i style="width:52px"></i></div><div><i style="width:52px"></i><i style="width:52px"></i></div><div><i style="width:52px"></i><i style="width:52px"></i></div></div>
  <div class="sp-name">爻观</div>
  <div class="sp-seal">观</div>
  <div class="sp-sub">六 爻 排 盘</div>
</div>
<script src="js/lunar.js"></script>
<script src="data/zhouyi.js"></script>
<script src="js/najia.js"></script>
<script src="js/trng.js"></script>
<script src="js/app.js"></script>
<script src="js/pages-cast.js"></script>
<script src="js/pages-pan.js"></script>
<script src="js/pages-more.js"></script>
<script>
  (function () {
    const sp = document.getElementById('splash');
    const t0 = performance.now();
    const MIN = sessionStorage.getItem('yg.splashed') ? 600 : 2650; // 首次完整播放；热启动快速过渡
    if (sessionStorage.getItem('yg.splashed')) sp.querySelectorAll('*').forEach(e => { e.style.animationDelay = '0s'; e.style.animationDuration = '.25s'; });
    sp.classList.add('light');
    const close = () => { sp.classList.add('done'); setTimeout(() => sp.remove(), 460); sessionStorage.setItem('yg.splashed', '1'); };
    sp.addEventListener('click', () => { if (performance.now() - t0 > 900) close(); });
    window.__YG.boot().then(() => setTimeout(close, Math.max(0, MIN - (performance.now() - t0))));
  })();
</script>
</body>
</html>
