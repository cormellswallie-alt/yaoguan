<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2ECE1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor: https://localhost; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://qrng.anu.edu.au https://lfdr.de">
<title>爻观</title>
<link rel="stylesheet" href="css/app.css">
<style>
 /* 安全区：状态栏 / 手势条 */
 .view{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
 .tb{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}

 #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#F2ECE1;z-index:100;transition:opacity .4s}
 #boot b{font-family:"YG Cal",serif;font-weight:400;font-size:64px;color:#1A1714;letter-spacing:6px}
 #boot span{font-size:11px;letter-spacing:4px;color:#8E8577}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot"><b>爻观</b><span>六 爻 排 盘</span></div>
<script src="js/lunar.js"></script>
<script src="data/zhouyi.js"></script>
<script src="js/najia.js"></script>
<script src="js/trng.js"></script>
<script src="js/app.js"></script>
<script src="js/pages-cast.js"></script>
<script src="js/pages-pan.js"></script>
<script src="js/pages-more.js"></script>
<script>
  window.__YG.boot().then(() => { const b = document.getElementById('boot'); b.style.opacity = 0; setTimeout(() => b.remove(), 450); });
</script>
